<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400"
     font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c0a14"/>
      <stop offset="0.55" stop-color="#100e1c"/>
      <stop offset="1" stop-color="#0b0a12"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#ece9f7"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.16" cy="0.28" r="0.55">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.84" cy="0.72" r="0.5">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- backdrop -->
  <rect width="1280" height="400" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="24" fill="url(#glowA)"/>
  <rect width="1280" height="400" rx="24" fill="url(#glowB)"/>
  <rect x="1.5" y="1.5" width="1277" height="397" rx="22.5" fill="none" stroke="#2a2444" stroke-width="2"/>

  <!-- MCP node-graph motif (right side): soft halos + connected nodes -->
  <g stroke="#3b3463" stroke-width="2" fill="none" opacity="0.85">
    <line x1="1028" y1="104" x2="1136" y2="168"/>
    <line x1="1028" y1="104" x2="944"  y2="190"/>
    <line x1="1136" y1="168" x2="1092" y2="288"/>
    <line x1="944"  y1="190" x2="1092" y2="288"/>
    <line x1="944"  y1="190" x2="1028" y2="104"/>
    <line x1="1136" y1="168" x2="1190" y2="276"/>
  </g>
  <g opacity="0.5">
    <circle cx="1028" cy="104" r="22" fill="#a855f7" opacity="0.18"/>
    <circle cx="1136" cy="168" r="26" fill="#3b82f6" opacity="0.16"/>
    <circle cx="944"  cy="190" r="20" fill="#f43f5e" opacity="0.16"/>
    <circle cx="1092" cy="288" r="24" fill="#c084fc" opacity="0.16"/>
  </g>
  <g>
    <circle cx="1028" cy="104" r="9"  fill="#a855f7"/>
    <circle cx="1136" cy="168" r="11" fill="#3b82f6"/>
    <circle cx="944"  cy="190" r="8"  fill="#f43f5e"/>
    <circle cx="1092" cy="288" r="10" fill="#c084fc"/>
    <circle cx="1190" cy="276" r="7"  fill="#22d3ee"/>
  </g>

  <!-- logo mark -->
  <g transform="translate(74,120)">
    <rect x="-6" y="-6" width="156" height="156" rx="40" fill="#a855f7" opacity="0.12"/>
    <rect width="144" height="144" rx="36" fill="url(#mark)"/>
    <g transform="translate(33,30) scale(3.4)" fill="none" stroke="#ffffff" stroke-width="2"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3l7 3v5c0 4.5-3 7.6-7 9-4-1.4-7-4.5-7-9V6z"/>
      <path d="M9 12l2 2 4-4"/>
    </g>
  </g>

  <!-- wordmark + taglines -->
  <text x="256" y="162" font-size="80" font-weight="800" fill="url(#word)" letter-spacing="-1.5">PurpleMCP</text>
  <text x="260" y="210" font-size="26" font-weight="700" fill="#c084fc" letter-spacing="3.5">BUILD IT · ATTACK IT · DEFEND IT</text>
  <text x="261" y="248" font-size="20" fill="#a6a1c8">A purple-team security lab for the Model Context Protocol</text>

  <!-- pillar pills -->
  <g font-size="16" font-weight="700">
    <g transform="translate(260,278)">
      <rect width="156" height="42" rx="11" fill="#a855f7" fill-opacity="0.14" stroke="#a855f7" stroke-opacity="0.5"/>
      <circle cx="28" cy="21" r="6" fill="#a855f7"/>
      <text x="46" y="27" fill="#c084fc">BUILD</text>
    </g>
    <g transform="translate(428,278)">
      <rect width="156" height="42" rx="11" fill="#f43f5e" fill-opacity="0.14" stroke="#f43f5e" stroke-opacity="0.5"/>
      <circle cx="28" cy="21" r="6" fill="#f43f5e"/>
      <text x="46" y="27" fill="#f43f5e">ATTACK</text>
    </g>
    <g transform="translate(596,278)">
      <rect width="156" height="42" rx="11" fill="#3b82f6" fill-opacity="0.14" stroke="#3b82f6" stroke-opacity="0.5"/>
      <circle cx="28" cy="21" r="6" fill="#3b82f6"/>
      <text x="46" y="27" fill="#3b82f6">DEFEND</text>
    </g>
  </g>

  <!-- stat strip -->
  <g font-size="15" font-weight="600" fill="#8983ad" letter-spacing="0.4">
    <text x="261" y="356">21 attacks &#160;·&#160; 16 guardrails &#160;·&#160; 5 LLM providers &#160;·&#160; CLI + desktop app</text>
  </g>
</svg>
